name: Test Charts

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'charts/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Add Helm repositories
        run: |
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add ollama https://otwld.github.io/ollama-helm
          helm repo update

      - name: Build dependencies
        run: |
          for chart in charts/*/; do
            echo "Building dependencies for $chart"
            helm dependency build "$chart"
          done

      - name: Template test
        run: |
          for chart in charts/*/; do
            echo "Testing template rendering for $chart"
            helm template test "$chart" --debug
          done

      - name: Validate manifests
        run: |
          for chart in charts/*/; do
            echo "Validating manifests for $chart"
            helm template test "$chart" | kubectl apply --dry-run=client -f - || true
          done

  kind-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Add Helm repositories
        run: |
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add ollama https://otwld.github.io/ollama-helm
          helm repo update

      - name: Run chart-testing (install)
        run: ct install --config ct.yaml
