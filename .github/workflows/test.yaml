name: Test Charts

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'charts/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add Helm repositories
        run: |
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add ollama https://otwld.github.io/ollama-helm
          helm repo update

      - name: Build dependencies
        run: |
          for chart in charts/*/; do
            echo "Building dependencies for $chart"
            helm dependency build "$chart"
          done

      - name: Template test
        run: |
          for chart in charts/*/; do
            echo "Testing template rendering for $chart"
            helm template test "$chart" --debug
          done

      - name: Validate manifests
        run: |
          for chart in charts/*/; do
            echo "Validating manifests for $chart"
            helm template test "$chart" | kubectl apply --dry-run=client -f - || true
          done

  kind-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Add Helm repositories
        run: |
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add ollama https://otwld.github.io/ollama-helm
          helm repo update

      - name: Run chart-testing (install)
        run: ct install --config ct.yaml
