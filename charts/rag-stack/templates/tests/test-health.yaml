apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rag-stack.ragApiName" . }}-test
  labels:
    {{- include "rag-stack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: curlimages/curl:8.23.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ["curl", "-fsS", "--retry", "30", "--retry-delay", "10", "--retry-all-errors",
                "http://{{ include "rag-stack.ragApiName" . }}:{{ .Values.ragApi.service.port }}/health"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
