{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rag-stack.fullname" . }}
  labels:
    {{- include "rag-stack.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                {{- if eq .service "api-gateway" }}
                name: {{ include "rag-stack.apiGateway.fullname" $ }}
                port:
                  number: {{ $.Values.apiGateway.service.port | default 8080 }}
                {{- else if eq .service "embedding-service" }}
                name: {{ include "rag-stack.embeddingService.fullname" $ }}
                port:
                  number: {{ $.Values.embeddingService.service.port | default 8080 }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
