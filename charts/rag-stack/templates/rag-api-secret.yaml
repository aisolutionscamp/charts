{{- if and .Values.ragApi.auth.enabled (not .Values.ragApi.auth.existingSecret) }}
{{- $name := include "rag-stack.ragApiName" . }}
{{- $key := .Values.ragApi.auth.apiKey }}
{{- if not $key }}
{{- /* Keep the generated key across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.ragApi.auth.secretKey) }}
{{- $key = index $existing.data .Values.ragApi.auth.secretKey | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rag-stack.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.ragApi.auth.secretKey }}: {{ $key | b64enc | quote }}
{{- end }}
