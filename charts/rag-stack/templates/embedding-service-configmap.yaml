{{- if .Values.embeddingService.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-stack.embeddingService.fullname" . }}
  labels:
    {{- include "rag-stack.embeddingService.labels" . | nindent 4 }}
data:
  EMBEDDING_MODEL: {{ .Values.embeddingService.config.model | default "sentence-transformers/all-MiniLM-L6-v2" | quote }}
  BATCH_SIZE: {{ .Values.embeddingService.config.batchSize | default 32 | quote }}
  MAX_LENGTH: {{ .Values.embeddingService.config.maxLength | default 512 | quote }}
  QDRANT_HOST: {{ include "rag-stack.qdrantHost" . | quote }}
  QDRANT_PORT: {{ include "rag-stack.qdrantPort" . | quote }}
  REDIS_HOST: {{ include "rag-stack.redisHost" . | quote }}
  REDIS_PORT: {{ include "rag-stack.redisPort" . | quote }}
{{- end }}
