{{- if .Values.redis.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-stack.redis.fullname" . }}
  labels:
    {{- include "rag-stack.redis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.redis.service.type | default "ClusterIP" }}
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "rag-stack.redis.selectorLabels" . | nindent 4 }}
---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-stack.redis.fullname" . }}-headless
  labels:
    {{- include "rag-stack.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "rag-stack.redis.selectorLabels" . | nindent 4 }}
{{- end }}
