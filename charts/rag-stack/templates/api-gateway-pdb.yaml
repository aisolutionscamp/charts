{{- if and .Values.apiGateway.enabled .Values.apiGateway.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rag-stack.apiGateway.fullname" . }}
  labels:
    {{- include "rag-stack.apiGateway.labels" . | nindent 4 }}
spec:
  {{- if .Values.apiGateway.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.apiGateway.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.apiGateway.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.apiGateway.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rag-stack.apiGateway.selectorLabels" . | nindent 6 }}
{{- end }}
