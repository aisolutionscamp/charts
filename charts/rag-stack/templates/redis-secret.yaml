{{- if and .Values.redis.enabled (not .Values.redis.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-stack.redis.fullname" . }}
  labels:
    {{- include "rag-stack.redis.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.redis.auth.password }}
  redis-password: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
{{- end }}
