# rag-stack: Qdrant + Ollama + rag-api
#
# What gets deployed:
#   - rag-api  (this chart)        HTTP API: POST /ingest, POST /query, GET /health
#   - Qdrant   (qdrant subchart)   vector store, API key generated by default
#   - Ollama   (ollama subchart)   embedding model and chat model
#
# rag-api pulls both models into Ollama on first start and reports ready
# (GET /health = 200) once the models are present and the Qdrant collection exists.
#
# Secure defaults: rag-api requires an API key (generated if you do not set one),
# Qdrant requires an API key, NetworkPolicies allow traffic to Qdrant and Ollama
# only from rag-api, all pods run as non-root, nothing is exposed outside the
# cluster unless you enable the Ingress.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name prefix.
fullnameOverride: ""

# =============================================================================
# rag-api
# =============================================================================
ragApi:
  # -- Number of rag-api pods. The API is stateless.
  replicaCount: 1

  image:
    # -- rag-api image (source: https://github.com/aisolutionscamp/stacks/tree/main/stacks/rag-pipeline/app).
    repository: ghcr.io/aisolutionscamp/rag-api
    # -- Image tag. Empty uses the chart appVersion.
    tag: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent

  # -- Image pull secrets, e.g. [{name: my-registry}].
  imagePullSecrets: []

  auth:
    # -- Require an API key on /ingest, /query and /documents.
    # Clients send it as "X-API-Key: <key>" or "Authorization: Bearer <key>".
    # /health stays open for probes.
    enabled: true
    # -- Use an existing Secret instead of creating one.
    existingSecret: ""
    # -- Key inside the Secret that holds the API key.
    secretKey: api-key
    # -- API key to store in the created Secret. Empty generates a random key
    # on install and keeps it on upgrades. Prefer existingSecret in production.
    apiKey: ""

  # Settings passed to rag-api as environment variables.
  config:
    # -- Ollama embedding model. Changing it later needs a new collection name,
    # because the vector size changes.
    embedModel: "nomic-embed-text:v1.5"
    # -- Ollama chat model that writes the answers (about 2 GB for llama3.2:3b).
    chatModel: "llama3.2:3b"
    # -- Pull missing models into Ollama on start.
    pullModels: true
    # -- Qdrant collection that stores the chunks.
    collection: documents
    # -- Chunk size in characters.
    chunkSize: 1000
    # -- Overlap between chunks in characters (must be smaller than chunkSize).
    chunkOverlap: 200
    # -- Number of chunks passed to the model per question.
    topK: 4
    # -- Maximum size of one uploaded file or JSON request in MB.
    maxUploadMb: 20
    # -- Seconds to wait for the model; CPU inference can be slow.
    llmTimeout: 300
    # -- Sampling temperature for answers.
    temperature: 0.1
    # -- Log level (DEBUG, INFO, WARNING, ERROR).
    logLevel: INFO

  # -- Ollama URL. Empty uses the bundled Ollama service.
  ollamaUrl: ""
  # -- Qdrant URL. Empty uses the bundled Qdrant service.
  qdrantUrl: ""
  # Qdrant API key used by rag-api. By default it is read from the Secret the
  # Qdrant subchart creates (<release>-qdrant-apikey, key api-key).
  qdrantApiKey:
    # -- Secret name. Empty uses the Secret of the bundled Qdrant.
    secretName: ""
    # -- Key inside the Secret.
    secretKey: api-key

  # -- Extra environment variables for rag-api, e.g. [{name: EMBED_BATCH_SIZE, value: "16"}].
  extraEnv: []

  service:
    # -- Service type. Keep ClusterIP and use the Ingress (with TLS) for outside access.
    type: ClusterIP
    # -- Service port.
    port: 8000

  # -- Resources for rag-api (it only forwards work to Ollama and Qdrant).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # -- Startup probe on /health. The first start pulls the models, so it allows up to 30 minutes.
  startupProbe:
    periodSeconds: 10
    failureThreshold: 180
  # -- Readiness probe on /health (Ollama models and Qdrant collection ready).
  readinessProbe:
    periodSeconds: 10
    failureThreshold: 3
  # -- Liveness probe on /health/live (process is up).
  livenessProbe:
    periodSeconds: 20
    failureThreshold: 3

  # -- Pod security context.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  # -- Container security context.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- Extra pod annotations.
  podAnnotations: {}
  # -- Node selector.
  nodeSelector: {}
  # -- Tolerations.
  tolerations: []
  # -- Affinity.
  affinity: {}

serviceAccount:
  # -- Create a ServiceAccount for rag-api (it needs no Kubernetes API access).
  create: true
  # -- ServiceAccount name. Empty uses <release>-rag-api.
  name: ""
  # -- ServiceAccount annotations.
  annotations: {}

# Ingress for rag-api. Use TLS: the API key is sent in a request header.
ingress:
  # -- Expose rag-api through an Ingress.
  enabled: false
  # -- Ingress class, e.g. nginx or traefik.
  className: ""
  # -- Annotations, e.g. cert-manager.io/cluster-issuer. Large PDF uploads may
  # need a higher body size limit (ingress-nginx: nginx.ingress.kubernetes.io/proxy-body-size).
  annotations: {}
  # -- Host names and paths.
  hosts:
    - host: rag.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS settings, e.g. [{secretName: rag-tls, hosts: [rag.example.com]}].
  tls: []

networkPolicy:
  # -- Create NetworkPolicies that allow traffic to Qdrant and Ollama only from
  # rag-api (and from their own pods: Qdrant peers, helm test pods). Needs a CNI
  # that enforces NetworkPolicies.
  enabled: true

# =============================================================================
# Qdrant (subchart: https://github.com/qdrant/qdrant-helm)
# Any key of the Qdrant chart can be set here.
# =============================================================================
qdrant:
  # -- Deploy Qdrant. Set false to use an external Qdrant (then set
  # ragApi.qdrantUrl and ragApi.qdrantApiKey.secretName).
  enabled: true
  image:
    # -- Qdrant image tag.
    tag: v1.20.0
  # -- true generates an API key and stores it in the Secret <release>-qdrant-apikey
  # (kept on upgrades). rag-api reads it from there.
  apiKey: true
  persistence:
    # -- Volume size for vectors and payloads.
    size: 10Gi
  # -- Resources for Qdrant. Memory use grows with the number of vectors.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  config:
    # -- Do not send anonymous usage statistics.
    telemetry_disabled: true

# =============================================================================
# Ollama (subchart: https://github.com/otwld/ollama-helm)
# Any key of the Ollama chart can be set here.
# =============================================================================
ollama:
  # -- Deploy Ollama. Set false to use an external Ollama (then set ragApi.ollamaUrl).
  enabled: true
  image:
    # -- Ollama image tag.
    tag: "0.40.11"
  ollama:
    # -- Model directory on the persistent volume. Matches HOME below, so Ollama runs as non-root.
    mountPath: /home/ollama/.ollama
    gpu:
      # -- Run on GPUs (needs the NVIDIA or AMD device plugin on the nodes).
      enabled: false
      # -- GPU type: nvidia or amd.
      type: nvidia
      # -- Number of GPUs.
      number: 1
    models:
      # -- Models to pull when the pod starts. Empty: rag-api pulls
      # ragApi.config.embedModel and ragApi.config.chatModel itself.
      pull: []
  # -- Environment for Ollama. HOME must match ollama.mountPath.
  extraEnv:
    - name: HOME
      value: /home/ollama
  persistentVolume:
    # -- Keep models on a volume so they are not downloaded again after a restart.
    enabled: true
    # -- Volume size; the default models need about 2.3 GB.
    size: 30Gi
    # -- Storage class. Empty uses the cluster default.
    storageClass: ""
  # -- Resources for Ollama. CPU inference with a 3B model needs several cores
  # and about 4 GB of memory.
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 8Gi
  # -- Pod security context (non-root).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # -- Container security context.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # -- Extra volumes: writable /tmp for the read-only root filesystem.
  volumes:
    - name: tmp
      emptyDir: {}
  # -- Extra volume mounts.
  volumeMounts:
    - name: tmp
      mountPath: /tmp
